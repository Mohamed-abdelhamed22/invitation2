<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages — Admin</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#f8f4ed;color:#4d4032;font-family:Montserrat,sans-serif;font-weight:300;padding:40px}
  h1{font-family:Georgia,serif;font-weight:500;color:#76562f;margin-top:0}
  .card{background:#fff;border:1px solid #e5d7c1;border-radius:8px;padding:18px;margin-bottom:14px}
  .card .name{font-weight:600;color:#9a7543}
  .card .time{font-size:11px;color:#9b7948;display:block;margin-top:6px}
  .card .msg{margin-top:8px;white-space:pre-wrap}
  .empty{color:#9b7948;padding:30px;text-align:center;font-style:italic}
  .count{font-size:12px;color:#9b7948;margin-bottom:16px}
  .logout{float:right;border:1px solid #a98550;background:transparent;color:#77572f;padding:8px 14px;cursor:pointer;font-size:11px;letter-spacing:.1em}
  #login{margin-bottom:24px}
  #login input{border:1px solid #e5d7c1;padding:10px;margin-right:8px;width:220px}
  #login button{border:1px solid #9a7543;background:#9a7543;color:#fff;padding:10px 18px;cursor:pointer;font-size:11px;letter-spacing:.1em}
  .error{color:#b03a2e;font-size:12px}
</style>
</head>
<body>
<h1>Guest Messages</h1>
<p class="count" id="count"></p>
<button class="logout" onclick="logout()">Log out</button>

<div id="login">
  <input type="password" id="password" placeholder="Admin password">
  <button onclick="login()">Enter</button>
  <span class="error" id="loginError"></span>
</div>

<div id="list"></div>

<script>
let adminToken = ''; // set on login; sent to the server for validation

function logout() {
  adminToken = '';
  sessionStorage.removeItem('admin');
  showLogin();
}

function showLogin() {
  document.getElementById('login').style.display = 'block';
  document.getElementById('list').style.display = 'none';
}

function showAdmin() {
  document.getElementById('login').style.display = 'none';
  document.getElementById('list').style.display = 'block';
  loadMessages();
}

async function login() {
  const val = document.getElementById('password').value;
  const err = document.getElementById('loginError');
  if (!val.trim()) {
    err.textContent = 'Enter the admin password';
    return;
  }
  adminToken = val.trim();
  err.textContent = '';
  sessionStorage.setItem('admin', '1');
  await showAdmin();
}

function apiUrl() {
  return new URL('/api/messages', window.location.href).href;
}

async function loadMessages() {
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  if (window.location.protocol === 'file:') {
    count.textContent = '';
    list.innerHTML = '<div class="error">Open this page through your hosted site, not as a file.</div>';
    return;
  }
  try {
    const res = await fetch(apiUrl(), {
      headers: { 'x-admin-token': adminToken }
    });
    if (res.status === 401) {
      sessionStorage.removeItem('admin');
      count.textContent = '';
      list.innerHTML = '<div class="error">Wrong admin password.</div>';
      return;
    }
    if (!res.ok) throw new Error('bad response');
    const messages = await res.json();
    document.getElementById('count').textContent =
      messages.length + ' message' + (messages.length === 1 ? '' : 's');
    const list = document.getElementById('list');
    if (!messages.length) {
      list.innerHTML = '<div class="empty">No messages yet.</div>';
      return;
    }
    list.innerHTML = messages.map(m =>
      '<div class="card">' +
        '<span class="name">' + escapeHtml(m.name) + '</span>' +
        '<div class="msg">' + escapeHtml(m.message) + '</div>' +
        '<span class="time">' + escapeHtml(m.timestamp) + '</span>' +
      '</div>'
    ).join('');
  } catch (e) {
    document.getElementById('count').textContent = '';
    document.getElementById('list').innerHTML = '<div class="error">Could not load messages. Check your Netlify function and Supabase configuration.</div>';
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c]);
}

document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

if (sessionStorage.getItem('admin') === '1') showLogin(); // require re-login each visit
else showLogin();
</script>
</body>
</html>
