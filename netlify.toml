[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Serve the admin page at /admin and the message API via the function.
[[redirects]]
  from = "/api/messages"
  to = "/.netlify/functions/messages"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Block sensitive files from ever being served publicly.
[[headers]]
  for = "/.env*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/server.js"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/messages.txt"
  [headers.values]
    X-Robots-Tag = "noindex"
